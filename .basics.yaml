ota:
  - platform: esphome
    id: ota_esphome
    # leer = OTA verschluesselt und Pflicht, nutzt den api-Key (ab ESPHome 2026.9)
    encryption:
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  output_power: 17dB
  reboot_timeout: 0s
  on_connect:
    - logger.log: "WiFi CONNECTED"
  on_disconnect:
    - logger.log: "WiFi DISCONNECTED"
  ap:
    ssid: ${name}
    password: !secret fallback_password
api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s
web_server:
  port: 80
  version: 3
  local: true
logger:
  level: DEBUG
debug:
  update_interval: 300s
text_sensor:
  - platform: debug
    reset_reason:
      name: "Reset Reason"
time:
  - platform: homeassistant
    id: homeassistant_time
button:
  - platform: restart
    name: "Restart"
    id: restart_button
sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
  - platform: debug
    free:
      name: "Heap Free"
    block:
      name: "Heap Max Block"
    loop_time:
      name: "Loop Time"
